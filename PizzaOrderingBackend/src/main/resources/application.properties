spring.application.name=Pizza-Ordering
# 1. Database Connection String (Change 'pizza_db' to your actual DB name)
spring.datasource.url=jdbc:mysql://localhost:3306/pizza_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# 2. Hibernate/JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect